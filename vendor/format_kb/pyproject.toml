[project]
name = "format-knowledge-base"
version = "0.5.0"
description = "Agent-oriented matching, structure, validation and deterministic container construction for 121 formats"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["fonttools[woff]>=4.62.0"]

[project.scripts]
format-kb = "format_kb.cli:main"

[dependency-groups]
dev = ["pytest>=8.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/format_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
