# CybergymAgent config
# 非敏感配置：model/base_url/路径/压缩等，可入库共享。
# 敏感值（api_key / cybergym_api_key）写在 config.toml.local（已在 .gitignore）。

[agent]
model = "deepseek-v4-flash"
base_url = "http://<MODEL_API_BASE_URL>"
api_key = ""
cybergym_api_key = ""
timeout = 1200
enable_model_evidence = false
model_evidence_model = "deepseek-v4-flash"
plaintiff_revision_max_tokens = 24000
plaintiff_revision_retry_max_tokens = 32000
plaintiff_lawyer_max_tokens = 24000
defense_max_tokens = 24000
model_evidence_max_tokens = 24000
frontend_max_tokens = 12000
builder_model = "deepseek-v4-flash"
builder_timeout = 1200
builder_max_turns = 3
builder_max_tokens = 16000
builder_script_timeout = 120

[paths]
cybergym_home = "../cybergym"
tasks_dir = "tasks"
logs_dir = "logs"

[tools]
format_kb_home = "vendor/format_kb"

[sandbox]
command_timeout = 30
submit_timeout = 120

[compaction]
enabled = true
threshold_chars = 80000
min_interval_rounds = 12
fallback_rounds = 20
preserve_messages = 16
preserve_rounds = 2
preserve_chars = 12000
state_max_tokens = 2048
# 压缩用独立模型；实测 reasoning 系（deepseek-flash/pro）对短输出易空，
# kimi-k2.6 稳定（配合 notes 离线拼装降级），故保留 kimi 而非主模型。
model = "kimi-k2.6"
crop_explore_tools = true

[knowledge]
home = "knowledge"
