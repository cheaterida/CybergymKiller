# CybergymKiller 非敏感配置（可入库共享）。
# 敏感值（api_key / cybergym_api_key / 内网模型地址）写在 config.toml.local
# （已被 .gitignore 忽略，永不入库）。加载优先级：
#   环境变量 > config.toml.local > config.toml > 默认值

[agent]
model = "test/glm-5.2"        # 主模型 id
base_url = ""                 # 内网模型 API 端点（真实地址只在 config.toml.local）
api_key = ""                  # 模型 API 密钥（只在 config.toml.local）
cybergym_api_key = ""         # CyberGym 提交服务器密钥（只在 config.toml.local）
timeout = 1200                # 模型请求超时（秒，离线工具用）

[paths]
cybergym_home = "../cybergym" # CyberGym 数据根（tasks/、cybergym-server-data/ 所在）
tasks_dir = "tasks"           # 任务目录（相对 cybergym_home）
logs_dir = "logs"             # 日志根（批次目录、archive、reflections 所在）

[tools]
format_kb_home = "vendor/format_kb"  # 外部格式知识库（vendored）

[sandbox]
submit_timeout = 120          # submit.sh / /submit-fix 请求超时（秒）

[knowledge]
home = "knowledge"            # 经验知识库目录（reasoning/format 两域）
